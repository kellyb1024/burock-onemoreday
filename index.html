<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="BUROCK · One More Day Busan">
<meta property="og:description" content="부락 다음 날, 부산에서 하루 더 · 로컬 하루 코스 · 시장 · 축제 (VS BI prototype)">
<meta property="og:image" content="https://burock-onemoreday.vercel.app/og.jpg">
<meta property="og:url" content="https://burock-onemoreday.vercel.app">
<title>BUROCK · One More Day Busan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face { font-family:"BUROCK"; src:url("assets/BUROCK.otf") format("opentype"); }
:root{
  --navy:#0b3387; --night:#011456; --orange:#ec9c00; --red:#c90614; --pink:#cb2e59; --sky:#a4bbd3;
  --beige:#f1ece3; --beige2:#e6dfd3; --ink:#1a1d2e; --mute:#6b6f80; --line:#dcd6cb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:"Pretendard",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;position:relative;min-height:100vh;overflow:hidden;background:#fff}

/* edge stripes (BI motif, like Fuji Rock's side bars) */
.edge{position:absolute;top:118px;bottom:0;width:5px;z-index:1;
  background:repeating-linear-gradient(180deg,var(--orange) 0 26px,transparent 26px 70px,var(--navy) 70px 110px,transparent 110px 150px,var(--pink) 150px 168px,transparent 168px 240px)}
.edge.l{left:0}.edge.r{right:0;background-position:0 90px}

/* header */
header{background:var(--navy);color:#fff;display:flex;align-items:flex-start;height:56px;position:sticky;top:0;z-index:20}
header .brand{flex:1;padding:0 0 0 14px;line-height:56px}
header .brand b{font-family:"BUROCK";font-size:24px;display:block;font-weight:400}
header .brand small{font-size:9px;letter-spacing:.06em;opacity:.85}
header .lang{margin-top:14px;margin-right:14px !important;border:1.5px solid #fff;border-radius:99px;font-size:11px;font-weight:700;padding:4px 10px;margin-right:10px}
header .menu{width:62px;background:#fff;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.06em;height:62px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
header .menu img{width:28px;margin-bottom:2px}

/* icon strip */
.strip{margin:12px 10px 0;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(11,51,135,.14);display:flex;overflow-x:auto;scrollbar-width:none;position:relative;z-index:5}
.strip a{flex:none;width:76px;padding:9px 4px 8px;text-align:center;font-size:10px;font-weight:700;color:var(--navy);border-right:1px solid var(--line);line-height:1.2}
.strip a:last-child{border-right:0}
.strip a img{height:30px;display:block;margin:0 auto 4px;object-fit:contain}
.strip a svg{height:30px;width:30px;display:block;margin:0 auto 4px}
.strip a.on{background:var(--beige)}

main{padding:0 22px 40px;position:relative;z-index:2}
.pill{margin:18px -8px 18px;background:var(--beige);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.pill h1{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:.04em}
.pill span{font-size:12px;color:var(--mute)}
.sec{text-align:center;font-family:"BUROCK";font-size:min(24px,5.1vw);white-space:nowrap;color:var(--navy);margin:34px 0 16px;font-weight:400}
.sec::before,.sec::after{content:"";display:inline-block;width:12px;height:12px;vertical-align:3px;margin:0 7px}
.sec::before{background:var(--orange);border-radius:50%}.sec::after{background:var(--pink);border-radius:2px;transform:rotate(45deg)}

/* home hero */
.hero{margin:14px -22px 0;background:linear-gradient(180deg,#fff 0,var(--beige) 100%);padding:18px 22px 0;text-align:center}
.hero h2{font-family:"BUROCK";font-size:38px;line-height:.95;color:var(--navy);font-weight:400}
.hero h2 em{font-style:normal;color:var(--orange)}
.hero p{font-size:13px;color:var(--mute);margin-top:8px}
.hero .band{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:14px;height:150px}
.hero .band img{height:118px;width:auto}.hero .band img.c{height:148px}
.hero .floor{height:14px;margin:0 -22px;background:repeating-linear-gradient(90deg,var(--navy) 0 4px,transparent 4px 9px)}

/* news-card style list (Fuji Rock home) */
.cards{background:var(--beige);border-radius:16px;padding:10px;display:grid;gap:10px}
.card{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.card .th{height:78px;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.card .th img{height:72px}
.card .tx small{font-size:12px;color:var(--mute);font-weight:600;display:block}
.card .tx b{font-size:16px;font-weight:800;line-height:1.3;display:block}
.more{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 0;width:78%;background:var(--beige);border-radius:99px;padding:12px;font-weight:700;font-size:14px}
.more i{width:22px;height:22px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);font-style:normal;font-size:12px}

/* plain list (Fuji Rock area guide) */
.list{border-top:1px solid var(--line)}
.list a{display:grid;grid-template-columns:52px 1fr 16px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.list .tm{font-size:13px;font-weight:800;color:var(--orange)}
.list .nm small{display:block;font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.list .nm b{font-size:15px;font-weight:700}
.list .nm span{font-size:12px;color:var(--mute);margin-left:4px}
.list .ar{color:var(--navy);font-weight:700}
.intro{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.intro img{width:96px}
.intro p{font-size:14px}
.intro p b{color:var(--navy)}
.meta{font-size:12px;color:var(--mute);margin-bottom:10px}

/* detail */
.visual{margin:14px -22px 0;height:180px;position:relative;display:flex;align-items:flex-end;padding:16px 22px;color:#fff;overflow:hidden}
.visual .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 3px,transparent 3px 9px)}
.visual img{position:absolute;right:14px;bottom:-8px;height:140px}
.visual .cap{position:relative;z-index:2}
.visual .cap small{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.9}
.visual .cap h1{font-family:"BUROCK";font-size:22px;line-height:1.05;max-width:240px;font-weight:400}
.dt h2{font-size:19px;font-weight:800;margin-top:18px}
.dt h2 span{font-size:14px;color:var(--mute);font-weight:500;margin-left:6px}
.badge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--orange);border-radius:99px;padding:2px 8px;margin-top:6px}
.dt .lead{font-size:15px;margin-top:10px}
.info{margin-top:18px;border-top:1px solid var(--line)}
.info .row{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.info .row svg{width:22px;height:22px;stroke:var(--orange);fill:none;stroke-width:1.8;margin-top:1px}
.info .row h4{font-size:12px;font-weight:800;color:var(--mute)}
.info .row p{font-size:14px}
.note{background:var(--beige);padding:14px 16px;margin-top:18px;font-size:13px}
.note h5{font-size:13px;font-weight:800;margin-bottom:4px}
.btn{display:block;text-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:15px;margin-top:20px}
.btn.ghost{background:var(--beige);color:var(--navy);margin-top:10px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:12px;font-weight:700;color:var(--navy)}

/* culture & tradition rows */
.trow{padding:16px 2px;border-bottom:1px solid var(--line)}
.trow small{font-family:"BUROCK";font-size:12px;color:var(--orange)}
.trow b{display:block;font-size:16px;font-weight:800}
.trow b span{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
.trow p{font-size:14px;color:#3b3f50;margin-top:2px}


/* illustrated district map */
.map{margin:14px -22px 0;background:#dce8f3;position:relative}
.map svg{display:block;width:100%;height:auto}
.mapcap{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--mute);margin:8px 0 0}
.mapcap i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:15px 2px;border-bottom:1px solid var(--line)}
.mrow small{font-family:"BUROCK";font-size:11px;color:var(--orange)}
.mrow b{display:block;font-size:16px;font-weight:800}
.mrow b span{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
.mrow p{font-size:13.5px;color:#3b3f50;margin-top:2px}
.mrow .hrs{font-size:12px;color:var(--mute)}
.mrow .lk{display:flex;gap:12px;margin-top:6px;font-size:12px;font-weight:700;color:var(--navy)}
.mrow .gu{font-size:11px;font-weight:700;color:var(--navy);background:var(--beige);border-radius:99px;padding:2px 8px;height:fit-content}


/* motif band (day title) */
.dband{margin:0 -22px 0;min-height:200px;background-size:cover;background-position:center 14%;display:block;padding:20px 12px 0 22px;position:relative}
.dband .bt{padding-bottom:58px}
.dband.sm{min-height:110px}
.dband .bt small{font-size:12px;font-weight:700;opacity:.95}
.dband .bt h1{font-family:"BUROCK";font-size:26px;line-height:1;font-weight:400;margin:2px 0 6px}
.dband .bt p{font-size:12.5px;font-weight:600;line-height:1.45;background:rgba(255,255,255,.88);color:#1a1d2e;border-radius:8px;padding:6px 9px;display:inline-block}
.dband img{position:absolute;right:10px;bottom:0;width:auto}.dband img.sasang{height:140px}.dband img.saha{height:124px}.dband img.oldtown{height:139px}.dband.sm img.sasang{height:98px}.dband.sm img.saha{height:87px}.dband.sm img.oldtown{height:97px}.dband.sm .bt{padding-bottom:20px;padding-right:110px}.dband .bt p{width:176px;min-height:calc(3 * 1.45em + 12px);box-sizing:border-box;word-break:keep-all;white-space:nowrap}
.card .th{background-size:cover;background-position:center 25%}
.list a.ph{grid-template-columns:52px 1fr 64px;gap:0}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;display:block;background-size:cover;background-position:center}
/* detail hero */
.hero2{margin:14px -22px 0;height:230px;position:relative;background:#ddd;background-size:cover;background-position:center 20%;overflow:hidden}
.hero2 img{width:100%;height:100%;object-fit:cover;display:block}
.hero2 .cr{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
.mstrip{margin:0 -22px;height:12px;background-size:cover;background-position:center 75%}
.dt .when{font-size:11px;font-weight:800;letter-spacing:.06em;margin-top:16px}
.dt h2{font-size:21px;font-weight:800;margin-top:2px;line-height:1.25}
.dt .kname{font-size:13px;color:var(--mute)}
.localnote{margin-top:14px;border-left:4px solid var(--orange);background:var(--beige);padding:12px 14px}
.localnote h5{font-family:"BUROCK";font-size:12px;color:var(--navy);font-weight:400;margin-bottom:4px}
.localnote p{font-size:14.5px;line-height:1.6}
.srcline{font-size:12px;color:var(--mute);margin-top:10px}
/* markets photo */
.mph{width:104px}
.mph img{width:104px;height:78px;object-fit:cover;border-radius:8px;display:block}
.mph span{display:block;font-size:8.5px;color:var(--mute);line-height:1.3;margin-top:3px}
/* rock x tradition */
.tlead{font-size:15px;font-weight:600;margin:-4px 0 6px}
.tcard{padding:16px 0;border-bottom:1px solid var(--line)}
.tag2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag2 span{font-family:"BUROCK";font-size:12px;color:#fff;background:var(--navy);padding:3px 9px;border-radius:99px}
.tag2 i{font-style:normal;color:var(--orange);font-weight:800}
.tag2 b{font-size:15.5px;font-weight:800}
.tko{font-size:12px;color:var(--mute);margin:3px 0 4px}
.tcard p{font-size:14px}
.tcard .tmeta{font-size:11.5px;color:var(--mute);margin-top:6px}
.tnote{font-size:11.5px;color:var(--mute);margin-top:14px}


/* events */
.cal{display:grid;gap:12px}
.evc{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.evc img{width:86px;height:120px;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.evc small{font-family:"BUROCK";font-size:13px;color:var(--orange)}
.evc b{display:block;font-size:16px;font-weight:800;line-height:1.25}
.evc span{display:block;font-size:12px;color:var(--mute)}
.evc em{display:inline-block;margin-top:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--navy);background:var(--beige);border-radius:99px;padding:2px 8px}
.poster{margin:14px -22px 0;background:var(--beige2);padding:18px 0;text-align:center;position:relative}
.poster img{width:62%;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.poster .cr{display:block;font-size:10px;color:var(--mute);margin-top:8px}
.stats{display:grid;grid-template-columns:1fr;gap:6px;margin-top:14px}
.stats div{background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:146px 1fr;align-items:center;gap:8px}
.stats b{font-family:"BUROCK";font-size:17px;white-space:nowrap;color:#ffc93c;font-weight:400}
.stats span{font-size:12px;line-height:1.35}
.prow{display:flex;gap:10px;overflow-x:auto;margin:0 -22px;padding:0 22px 6px;scrollbar-width:none}
.prow a{flex:none;width:112px}
.prow img{width:112px;height:156px;object-fit:cover;border-radius:6px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.prow small{font-family:"BUROCK";font-size:11px;color:var(--orange);display:block;margin-top:6px}
.prow b{font-size:12.5px;line-height:1.3;display:block}
/* market detail */
.sub{font-family:"BUROCK";font-size:15px;color:var(--navy);font-weight:400;margin:22px 0 6px}
.enjoy{list-style:none;counter-reset:n}
.enjoy li{counter-increment:n;position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line)}
.enjoy li::before{content:counter(n);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.enjoy b{font-size:15px}
.enjoy p{font-size:13.5px;color:#3b3f50}
/* story timeline */
.tl2{position:relative;margin-top:10px}
.tl2::before{content:"";position:absolute;left:74px;top:4px;bottom:4px;width:2px;background:repeating-linear-gradient(180deg,var(--orange) 0 10px,var(--pink) 10px 20px,var(--navy) 20px 30px)}
.ev{display:grid;grid-template-columns:66px 1fr;gap:22px;padding:10px 0 14px}
.ev .yr{font-family:"BUROCK";font-size:15px;color:var(--navy);line-height:1.1;text-align:right}
.ev .bd b{font-size:16px;font-weight:800;display:block}
.ev .bd p{font-size:14px;margin-top:4px}


/* market shops */
.shops{display:grid;gap:12px}
.shop{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.shop img{width:100%;height:150px;object-fit:cover;display:block}
.shop .sb{padding:10px 12px 12px}
.shop .stall{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--orange);border-radius:99px;padding:2px 9px;margin-bottom:4px}
.shop b{display:block;font-size:15.5px;font-weight:800}
.shop p{font-size:13.5px;margin-top:4px}
.shop .sm{font-size:12px;color:var(--mute)}
.shop .sm a{color:var(--navy);font-weight:700}
.shop .cr2{font-size:10px;color:#a0a3ad;margin-left:6px}


/* legs between stops */
.leg{display:flex;align-items:center;gap:8px;padding:6px 2px 6px 56px;font-size:12px;color:var(--mute);border-bottom:1px dashed var(--line)}
.leg i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--beige);color:var(--navy)}
.leg i.transit{background:var(--navy);color:#fff}
/* essentials */
.ess{display:grid;gap:14px}
.ec{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.ec img{width:100%;height:180px;object-fit:cover;display:block}
.ec .cr{position:absolute;right:8px;top:156px;font-size:9px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
.ec .eb{padding:12px 14px 14px}
.ec small{font-family:"BUROCK";font-size:11px;color:var(--orange)}
.ec b{display:block;font-size:17px;font-weight:800}
.ec p{font-size:13.5px;margin-top:4px}
.ec .sm{font-size:12px;color:var(--mute)}
.ec .sm a{color:var(--navy);font-weight:700}
.ec .src2{font-size:10.5px;color:#a0a3ad;margin-top:6px}

/* floating vertical tab (Fuji Rock "Buy Tickets") */
.ftab{position:fixed;right:max(0px,calc(50% - 240px));bottom:90px;z-index:30;background:var(--navy);color:#fff;border-radius:12px 0 0 12px;padding:12px 7px;writing-mode:vertical-rl;font-size:12px;font-weight:800;letter-spacing:.04em;border:2px solid #fff;border-right:0}

/* footer sitemap */
footer{background:var(--beige2);padding:18px 22px 30px;position:relative;z-index:2}
.site{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}
.site a{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;color:var(--navy)}
.site a i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--beige);display:grid;place-items:center;overflow:hidden}
.site a i img{height:32px}
.site a i svg{width:24px;height:24px}
.fine{font-size:11px;color:var(--mute);margin-top:0;line-height:1.6}

/* menu overlay */
.overlay{position:fixed;inset:0;z-index:50;display:none;justify-content:center;background:rgba(1,20,86,.35)}
.overlay.open{display:flex}
.overlay .panel{width:100%;max-width:480px;background:var(--beige2);padding:80px 26px 30px;position:relative}
.overlay .x{position:absolute;top:18px;right:18px;font-size:13px;font-weight:800;color:var(--navy)}

/* day agenda in v2 style (colour field panel) */
.dg{margin:0 -22px;background:var(--f);color:var(--i);padding:22px 16px 40px}
.dg ol{list-style:none;display:grid;gap:4px;margin:0;padding:0}
.dg .st{display:grid;grid-template-columns:58px 1fr 72px;gap:12px;align-items:center;padding:14px 14px;background:var(--b1)}
.dg .st:nth-child(4n+3){background:var(--b2)}
.dg time{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dg h4{font-size:15px;line-height:1.3;font-weight:800;margin:0;word-break:keep-all}
.dg h4 a{color:inherit;text-decoration:none}
.dg h4 span{font-weight:500;font-size:12.5px}
.dg p{font-size:13px;line-height:1.4;margin:3px 0 0;word-break:keep-all}
.dg .nt{color:var(--s)}
.dg .nv{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:inherit;text-decoration:underline;text-underline-offset:3px}
.dg .th{width:72px;height:72px;object-fit:cover;display:block;background-size:cover;background-position:center}
.dg .lg{font-size:12.5px;padding:6px 14px 6px 84px;color:var(--s);word-break:keep-all}
.dg .lg span{font-weight:800;margin-right:8px;color:var(--i)}

.hgap{height:14px}
/* ===== laptop / desktop layout ===== */
@media (min-width:1000px){
  .app{max-width:1200px;overflow:clip}
  header{height:68px}
  header .brand{line-height:68px;padding-left:40px}
  header .brand b{font-size:30px}
  header .lang{margin-top:19px;margin-right:40px !important}
  .strip{margin:16px 40px 0;justify-content:center;overflow:visible}
  .strip a{flex:1 1 0;width:auto;font-size:12.5px;padding:12px 6px 10px}
  .strip a img,.strip a svg{height:36px;width:auto}
  main{padding:0 40px 60px}
  .sec{font-size:30px;margin:56px 0 22px}
  /* full-bleed blocks follow the wider gutter */
  .hero,.map,.dband,.dg,.hero2,.mstrip,.poster,.visual{margin-left:-40px;margin-right:-40px}
  .prow{margin:0;padding:0 0 6px}
  /* home hero: title left, band right */
  .hero{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;column-gap:24px;text-align:left;padding:40px 60px 0}
  .hero h2{grid-column:1;font-size:50px;white-space:nowrap}
  .hero p{grid-column:1;font-size:17px;margin-top:14px;align-self:start}
  .hero .band{grid-column:2;grid-row:1/3;height:260px;margin-top:0}
  .hero .band img{height:190px}.hero .band img.c{height:236px}
  .hero .floor{grid-column:1/-1;margin:0 -60px}
  /* home: map beside the three day cards */
  .hday{display:grid;grid-template-columns:3fr 2fr;gap:28px;align-items:center}
  .hday .map{margin:0;border-radius:12px;overflow:hidden}
  .hgap{display:none}
  .cards{padding:14px;gap:14px}
  .card{grid-template-columns:150px 1fr}
  .card .th{height:104px}.card .th img{height:96px}
  .card .tx b{font-size:20px}
  .list{display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px}
  .more{width:340px}
  .prow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px;overflow:visible}
  .prow a{width:auto}
  .prow img{width:100%;height:auto;aspect-ratio:3/4}
  .prow img[style]{height:auto!important;aspect-ratio:4/3}
  .prow b{font-size:14px}
  /* day page: map stays on the left, course on the right */
  .dlay{display:grid;grid-template-columns:5fr 6fr;gap:32px;align-items:start;margin-top:24px}
  .dmap{position:sticky;top:96px}
  .dmap .map{margin:0;border-radius:12px;overflow:hidden}
  .dmain .dband,.dmain .dg{margin-left:0;margin-right:0}
  .dmain .dband{border-radius:12px 12px 0 0;min-height:240px}
  .dg{padding:24px 20px 40px;border-radius:0 0 12px 12px}
  .dg .st{grid-template-columns:76px 1fr 104px;padding:16px 18px}
  .dg time{font-size:24px}
  .dg h4{font-size:17px}.dg p{font-size:14px}
  .dg .th{width:104px;height:80px}
  .dg .lg{padding-left:112px;font-size:13.5px}
  /* detail pages: wide photo, readable column */
  .hero2{height:400px}
  .dt,.tlead,.tl2{max-width:780px;margin-left:auto;margin-right:auto}
  .pill{max-width:none;margin:28px 0 22px;padding:18px 24px}
  .pill h1{font-size:22px}
  .ess{grid-template-columns:repeat(3,1fr);gap:20px}
  .ec .cr{top:156px}
  .cal{grid-template-columns:repeat(2,1fr);gap:20px 32px}
  .shops{grid-template-columns:repeat(2,1fr)}
  .poster img{width:auto;height:520px}
  main > .map{max-width:none}
  footer{padding:24px 40px 36px}
}

/* scroll reveal (v2 style): parts rise in as they enter the screen */
@media (min-width:1000px){
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}
}
.dg .st{transition:transform .25s}
.dg .st:hover .th{transform:scale(1.05)}
.dg .th{transition:transform .3s}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}
</style>

<script>
const D = {"areas": [{"id": "sasang", "name": "Sasang · Gupo", "ko": "사상 · 구포", "title": "Riverside Day", "titleKo": "부락 바로 옆, 낙동강의 하루", "img": "shark_drums.png", "face": "shark.png", "guide": "Kkari", "color": "#2c3088", "span": "07:00 – 20:00", "stops": [{"t": "07:00", "cat": "Breakfast", "name": "Samnak Hadong Jaecheopguk", "ko": "삼락하동재첩국", "hood": "Sasang", "line": "Clam soup breakfast by the Nakdong", "menu": "재첩국 정식 ₩8,000 · 재첩회 ₩10,000", "hours": "05:00–21:30 · 명절 휴무", "addr": "사상구 낙동대로1518번길 33", "tel": "051-301-7200", "src": "Taste of Busan 2025", "q": "삼락하동재첩국", "photo": "samnak.jpg", "credit": "Photo: Taste of Busan 2025 (Busan City)", "local": "This stretch of the Nakdong riverbank is lined with jaecheopguk (tiny freshwater clam soup) restaurants. This one uses domestic clams from the Seomjin River, soaked in salt water and washed several times, and also helped popularize clams served raw and steamed. It opens at 5 a.m., so it works as a post-show breakfast."}, {"t": "08:30", "cat": "Walk", "name": "Samrak Ecological Park", "ko": "삼락생태공원", "hood": "Sasang", "line": "The festival ground, now quiet. Riverside walk.", "q": "삼락생태공원", "photo": "samrak.jpg", "credit": "Photo: VisitBusan", "local": "A 4.72 km² riverside park on the Nakdong floodplain. Cherry blossoms form a tunnel along the embankment in spring, reeds and cosmos fill it in autumn, and migratory birds rest here in winter. Bikes can be rented inside the park.", "go": {"mode": "transit", "min": 20, "text": "20 min · Bus 126, 6 stops"}}, {"t": "10:30", "cat": "Market", "name": "Gupo Market", "ko": "구포시장", "hood": "Buk-gu", "line": "400-year-old market. 5-day market on 3, 8, 13, 18, 23, 28.", "hours": "08:00–20:00 · 점포별 상이", "addr": "북구 구포시장2길 7", "access": "덕천역 3번 출구 도보 5분", "src": "VisitBusan", "q": "구포시장", "photo": "gupo.jpg", "credit": "Photo: VisitBusan", "local": "The market grew up around the old Gupo ferry, where goods came down the Nakdong. On dates ending in 3 and 8 the 5-day market spills into the side alleys. From the market entrance, the Geumbit Noeul (Golden Sunset) Bridge crosses to Hwamyeong Eco Park, a sunset spot over the river. The 1919 Gupo Manse Street (independence cry) starts right outside, with murals along 600 m.", "go": {"mode": "transit", "min": 23, "text": "23 min · Bus 126, 11 stops"}}, {"t": "12:30", "cat": "Lunch", "name": "Geumyong Dumpling", "ko": "금용 만두", "hood": "Buk-gu", "line": "Shandong-style dumplings since 1960", "menu": "찐만두 ₩8,000 · 군만두 ₩8,000", "hours": "10:30–20:30 · 명절 휴무", "addr": "북구 구포만세길 75", "tel": "051-332-1261", "src": "Taste of Busan 2025", "q": "금용만두 구포", "photo": "geumyong.jpg", "credit": "Photo: Taste of Busan 2025 (Busan City)", "local": "Open since 1960. Shandong-style dumplings filled with braised pork skin, beef shank and oxtail. The day's batch usually sells out, so go before evening.", "go": {"mode": "walk", "min": 12, "text": "Walk 12 min · 805 m"}}, {"t": "15:00", "cat": "Music", "name": "Sasang Indie Station", "ko": "사상인디스테이션", "hood": "Sasang", "line": "Indie venue built from 27 shipping containers", "hours": "평일 09:00–18:00 · 공연 시 변동", "addr": "사상구 사상로 190", "tel": "051-316-7631", "access": "사상역 2·4번 출구 140m", "src": "Busan Cultural Foundation", "q": "사상인디스테이션", "photo": "indie.jpg", "credit": "Photo: Busan Cultural Foundation", "local": "A youth indie venue built from 27 shipping containers, 140 m from Sasang Station. During BUROCK 2026 it hosted Bu-long Night, the after-party that kept the crowd in West Busan.", "go": {"mode": "transit", "min": 23, "text": "23 min · Metro Line 2, Gumyeong → Sasang, 5 stops"}}, {"t": "18:30", "cat": "Dinner", "name": "Gombo Sikdang", "ko": "곰보식당", "hood": "Sasang", "line": "Korean beef since 1975", "menu": "짝갈비살 ₩29,000 · 육회비빔밥 ₩15,000", "hours": "10:00–22:00 · 명절 전날·당일 휴무", "addr": "사상구 낙동대로 1564", "tel": "051-304-7733", "src": "Taste of Busan 2025", "q": "곰보식당 사상", "photo": "gombo.jpg", "credit": "Photo: Taste of Busan 2025 (Busan City)", "local": "Open since 1975. It serves only selected Korean beef and goes for the savory, original flavor of the meat rather than softness.", "go": {"mode": "transit", "min": 20, "text": "20 min · Bus 33, 10 stops to Bukgu Office"}}], "districts": ["사상구", "북구"], "pins": ["삼락생태공원", "구포시장"], "motif": "motif_navy.jpg", "ink": "#fff", "travel": "~1 h 40 min of travel"}, {"id": "saha", "name": "Saha", "ko": "사하 · 서구 · 다대포", "title": "Sunset Day", "titleKo": "바다 따라 노을로 끝나는 하루", "img": "seagull_guitar.png", "face": "seagull.png", "guide": "Kkiru", "color": "#cb1f2a", "span": "10:00 – 21:00", "stops": [{"t": "10:00", "cat": "Cable car", "name": "Songdo Marine Cable Car", "ko": "송도해상케이블카", "hood": "Songdo, Seo-gu", "line": "Cable car over the sea from Songdo Beach", "hours": "09:00–21:00 (Mar–Jun, Sep–Nov) · 22:00 Jul–Aug · 20:00 Dec–Feb · tickets until 30 min before close", "addr": "서구 송도해변로 171", "tel": "051-247-9900", "src": "Busan Air Cruise (official site)", "q": "송도해상케이블카", "photo": "songdo.jpg", "credit": "Photo: Michiel1972 / Wikimedia Commons (CC BY-SA 3.0) · Songdo Beach", "local": "The cable car crosses the sea from Songdo Beach toward Amnam Park, with two cabin types, Air Cruise and Crystal Cruise. Songdo was almost the only West Busan spot in Busan's top-20 tourist sites in a 2023 Korea Tourism Organization × Busan City review, so it is a good bridge between the famous and the local. Operation can stop early in bad weather."}, {"t": "11:45", "cat": "Village", "name": "Gamcheon Culture Village", "ko": "감천문화마을", "hood": "Gamcheon", "line": "Colorful hillside houses and alleys", "q": "감천문화마을", "photo": "gamcheon.jpg", "credit": "Photo: Bernard Gagnon / Wikimedia Commons (CC0)", "local": "Built in 1955 by about 4,000 Taegeukdo believers and war refugees, the houses step up the hillside in neat rows, and every alley connects to every other. A 2009 public art project turned the village into a gallery. A stamp route takes about 1 hour 20 minutes.", "go": {"mode": "transit", "min": 32, "text": "32 min · Bus 61, Songdo-ipgu → Gamcheon Culture Village, 11 stops (18 min walk to the stop)"}}, {"t": "13:30", "cat": "Lunch", "name": "Jaeseong Milmyeon", "ko": "재성밀면 감천직영점", "hood": "Gamcheon", "line": "Busan cold wheat noodles", "menu": "물밀면 · 비빔밀면", "hours": "영업시간 확인 필요", "addr": "사하구 감천로 61", "tel": "051-204-9925", "src": "Saha-gu Office · 부산의 맛", "q": "재성밀면 감천직영점", "photo": "jaeseong.jpg", "credit": "Photo: Naver blog godduddk (blog.naver.com/godduddk/221598958245)", "local": "Milmyeon is Busan's own cold noodle, made with wheat. Saha-gu lists this shop as a Taste of Busan pick, close to Gamcheon.", "go": {"mode": "transit", "min": 10, "text": "10 min · Village bus Saha-gu 1, 8 stops"}}, {"t": "15:30", "cat": "View", "name": "Amisan Observatory", "ko": "아미산전망대", "hood": "Dadae", "line": "The river mouth from above", "q": "아미산전망대", "photo": "amisan.jpg", "credit": "Photo: VisitBusan", "local": "From the top floor you see the sandbars the river built at its mouth: Doyodeung, Sinjado, Baekhapdeung, Jangjado. Floor 2 explains how the delta formed, and floor 3 has telescopes and a café. Open Tue–Sun 09:00–18:00. Eulsukdo, the migratory bird island (Natural Monument No. 179), is just upriver if you have extra time.", "go": {"mode": "transit", "min": 43, "text": "43 min · Village bus Saha-gu 15, Gamcheon-gogae → Molundae Apt, 27 stops"}}, {"t": "17:00", "cat": "Sunset", "name": "Dadaepo Beach", "ko": "다대포해수욕장", "hood": "Dadae", "line": "Sunset beach, BUROCK's home before Samrak", "q": "다대포해수욕장", "photo": "dadaepo.jpg", "credit": "Photo: Y.c.jang / Wikimedia Commons (CC BY-SA 3.0)", "local": "A beach where the Nakdong meets the sea, with dunes and a lagoon still forming. BUROCK was held here before it moved to Samrak in 2011. The old net-hauling song Dadaepo Hurisori comes from this shore.", "go": {"mode": "walk", "min": 19, "text": "Walk 19 min · 1.2 km downhill"}}, {"t": "18:00", "cat": "Dinner", "name": "Dadaepo Halmaejip", "ko": "다대포 할매집", "hood": "Dadae", "line": "Sea-view bar, house makgeolli and seafood", "hours": "화–금 16:00–23:30 · 토–일 14:00–23:30 · 월 휴무", "addr": "사하구 몰운대1길 55", "tel": "051-263-2801", "src": "VisitBusan", "q": "다대포 할매집", "photo": "halmae.jpg", "credit": "Photo: VisitBusan", "local": "A street-style bar facing the waves, with outdoor and rooftop seats for the sunset. House makgeolli, and seafood bought straight from the boats. Dishes are limited each day.", "go": {"mode": "walk", "min": 2, "text": "Walk 2 min · 184 m"}}], "districts": ["사하구", "서구"], "pins": ["송도", "감천문화마을", "다대포"], "motif": "motif_red.jpg", "ink": "#fff", "nudge": {"서구": [-2, -14]}, "travel": "~2 h 10 min of travel"}, {"id": "oldtown", "name": "Old Town", "ko": "중구 · 영도", "title": "Harbor Day", "titleKo": "항구 골목에 남은 옛 부산", "img": "mackerel_bass.png", "face": "mackerel.png", "guide": "Ana", "color": "#f2b417", "span": "09:30 – 24:00", "stops": [{"t": "09:30", "cat": "Breakfast", "name": "Bugwang Dwaejigukbap", "ko": "부광돼지국밥", "hood": "Daecheong-dong", "line": "Three generations of pork soup", "menu": "돼지국밥 ₩10,000", "hours": "09:30–19:30 · 일요일·명절 휴무", "addr": "중구 대청로141번길 15-1", "src": "Taste of Busan 2025", "q": "부광돼지국밥", "photo": "bugwang.jpg", "credit": "Photo: Taste of Busan 2025 (Busan City)", "local": "Three generations, over 40 years. Kimchi and kkakdugi are made in-house."}, {"t": "10:30", "cat": "Book street", "name": "Bosu-dong Book Street", "ko": "보수동 책방골목", "hood": "Bosu-dong", "line": "Korea's only remaining used-book street", "hours": "가게별 상이 (20:00 전후 마감) · 첫째·셋째 화요일 휴무", "addr": "중구 보수동1가 일대 (국제시장 건너편 대청로 사거리)", "access": "자갈치역 3번 출구 도보 11분", "src": "VisitBusan · Busan Future Heritage", "q": "보수동책방골목", "photo": "bosu.jpg", "credit": "Photo: Mobius6 / Wikimedia Commons (CC BY-SA 4.0)", "local": "In 1950, a refugee couple from the North laid out boxes under the eaves and sold old magazines and used books. Students from the tent schools on the hill above walked this alley every day, and by the 1970s–80s about 70 bookshops lined it. Busan City lists it as future heritage: the only used-book street left in Korea. Used books here are often 40–70% off.", "go": {"mode": "walk", "min": 15, "text": "Walk 15 min · 932 m"}}, {"t": "11:30", "cat": "Market", "name": "BIFF Square · Gukje Market", "ko": "BIFF광장 · 국제시장", "hood": "Nampo", "line": "Film street, then the market refugees built after 1945", "q": "국제시장", "hours": "국제시장 09:00–20:00 · 일요일 휴무", "addr": "중구 신창로4가 일원", "src": "VisitKorea", "photo": "biff.jpg", "credit": "Photo: Christophe95 / Wikimedia Commons (CC BY-SA 4.0)", "local": "BIFF Square is the film street of Busan's old downtown, with market snacks like seed hotteok. Across the road, Gukje Market began in 1945 as a 'dottegi' market where returnees sold goods by the bundle, and it kept refugees alive during the war. Use the second-floor bridges to find your way.", "go": {"mode": "walk", "min": 3, "text": "Walk 3 min · 251 m"}}, {"t": "12:45", "cat": "Lunch", "name": "Mackerel Research Institute", "ko": "고등어연구소 본점", "hood": "Jungang-dong", "line": "The mackerel's own pick", "menu": "고태솥밥+오차즈케 ₩10,900 · 고등어온소바 ₩10,900", "hours": "11:00–15:00 / 17:00–21:30 · 명절 휴무", "addr": "중구 중앙대로 79-1", "src": "Taste of Busan 2025", "q": "고등어연구소 본점", "photo": "mackerel.jpg", "credit": "Photo: Taste of Busan 2025 (Busan City)", "local": "Mackerel is Busan's city fish. This place researched how to remove the fishy taste and serves Japanese-style mackerel dishes: stone-pot rice, warm soba, pressed sushi.", "go": {"mode": "walk", "min": 15, "text": "Walk 15 min · 1.0 km"}}, {"t": "14:30", "cat": "Village", "name": "Huinnyeoul Culture Village", "ko": "흰여울문화마을", "hood": "Yeongseon-dong, Yeongdo", "line": "Cliffside refugee village over the sea", "hours": "Every day · free · a residential village, keep it quiet", "addr": "영도구 흰여울길 일대", "tel": "051-419-4067", "src": "VisitBusan · Yeongdo-gu Office", "q": "흰여울문화마을", "photo": "huinnyeoul.jpg", "credit": "Photo: Appleysj / Wikimedia Commons (CC BY-SA 4.0)", "local": "Korean War refugees built tiny box houses stacked on this steep sea cliff. Yeongdo-gu renovated the empty houses in 2011, and the 14 alleys now hold cafés, workshops and small bookshops. The name means 'white rapids': mountain streams once fell straight into the sea here. Walk the village (about 1 km, 20 min), then take the Piano Steps down to the Jeoryeong Coastal Trail. You can also find the filming spot of The Attorney (변호인).", "go": {"mode": "transit", "min": 21, "text": "21 min · Bus 508, Jungang Stn → Huinnyeoul, 9 stops"}}, {"t": "16:30", "cat": "Market · Dinner", "name": "Jagalchi Market", "ko": "자갈치시장", "hood": "Nampo", "line": "Busan's fish market by the port. Buy on 1F, eat on 2F.", "q": "자갈치시장", "photo": "jagalchi.jpg", "credit": "Photo: Bernard Gagnon / Wikimedia Commons (CC0)", "local": "Korea's largest seafood market. It began as fishermen's stalls on reclaimed land in the 1930s and grew with refugees after the war. The red-aproned 'Jagalchi ajime', many of them war widows, became its symbol.", "go": {"mode": "transit", "min": 19, "text": "19 min · Bus 6, Huinnyeoul → Nampo-dong, 8 stops"}}, {"t": "19:30", "cat": "Night market", "name": "Bupyeong Kkangtong Night Market", "ko": "부평깡통야시장", "hood": "Bupyeong-dong", "line": "Korea's first permanent night market, opened 2013", "hours": "시장 09:00–20:00 · 야시장 19:30–24:00", "addr": "중구 부평1길 48", "tel": "051-243-1128", "access": "자갈치역에서 도보 약 7분", "src": "Jung-gu Office", "q": "부평깡통야시장", "photo": "bupyeong.jpg", "credit": "Photo: Christophe95 / Wikimedia Commons (CC BY-SA 4.0)", "local": "Bupyeong opened in 1910 as Korea's first public market. It got the name kkangtong (can) from the US Army canned goods sold here after the war. In October 2013 it became Korea's first permanent night market, with stalls given to multicultural families and people with disabilities. There is also a fish cake street.", "go": {"mode": "walk", "min": 12, "text": "Walk 12 min · 719 m"}}], "districts": ["중구", "영도구"], "pins": ["국제시장", "자갈치시장", "흰여울"], "motif": "motif_yellow.jpg", "ink": "#0b3387", "travel": "~1 h 25 min of travel"}], "markets": [{"name": "Jagalchi Market", "ko": "자갈치시장", "gu": "중구", "day": "oldtown", "pin": "자갈치시장", "tag": "SEAFOOD", "line": "Korea's largest seafood market. Home of the red-aproned 'Jagalchi ajime', women who kept it running after the war.", "hours": "05:00–22:00 · 첫째·셋째 화요일 휴무", "src": "Busan City Future Heritage · VisitKorea", "q": "자갈치시장", "photo": "jagalchi.jpg", "credit": "Photo: Bernard Gagnon / Wikimedia Commons (CC0)", "origin": "Named after the pebble (jagal) shore that was here. After the Nambin land reclamation in the 1930s, small fishermen and their wives set up stalls on the new ground. Returnees after 1945 and refugees after 1950 joined them, and women widowed by the war became the red-aproned 'Jagalchi ajime'. It was registered as a market in 1972.", "enjoy": [["Buy downstairs, eat upstairs", "Pick live fish on the 1st floor, then take it to a 2nd-floor 'chojang-jip' restaurant and pay a per-person table fee."], ["Kkomjangeo (hagfish) grill", "Grilled hagfish is a Busan favorite. Look for the grill stalls beside the main building."], ["Harbor view on the 7th floor", "The observatory looks out over the South Port toward Yeongdo."], ["Dried-fish market", "About 150 Japanese-era shop buildings from 1934 still stand here."], ["Jagalchi Festival · October", "Running since 1992, under the dialect slogan 'Oiso! Boiso! Saiso!' (Come, look, buy!)."]], "shops": [{"k": "yeongdo", "name": "Yeongdo Sanghoe", "ko": "영도상회", "stall": "1F · No. 376", "known": "Live seafood stall. Pick your fish here, then eat it upstairs at a 2nd-floor restaurant. The sign over the tanks reads 영도수산.", "addr": "중구 자갈치해안로 52, 자갈치시장 1층 376호", "tel": "0507-1332-4322", "hours": "09:00–20:00 · market closed 1st, 3rd, 5th Tue", "src": "Busan City foreign-language menu (menu.busan.go.kr)", "q": "자갈치시장 영도상회", "credit": "Photo: 부산광역시 외국어 메뉴판"}, {"k": "songhak", "name": "Songhak Hoetjip", "ko": "송학횟집", "stall": "2F · No. 19", "known": "Raw-fish restaurant on the 2nd floor, looking out over the South Port. Bring fish from the 1st floor or order here.", "addr": "중구 자갈치해안로 52, 자갈치시장 2층", "tel": "051-253-3317", "hours": "09:00–21:00 · closed 1st, 3rd, 5th Tue", "src": "Busan City foreign-language menu (menu.busan.go.kr)", "q": "자갈치시장 송학횟집", "credit": "Photo: 부산광역시 외국어 메뉴판"}, {"k": "dalbongi", "name": "Dalbongi Hoetjip", "ko": "달봉이횟집", "stall": "2F · No. 18", "known": "Raw fish, then grilled fish and spicy maeuntang (fish stew) to finish.", "addr": "중구 자갈치해안로 52, 자갈치시장 2층", "tel": "051-256-3340", "hours": "09:00–21:00 · closed 1st, 3rd, 5th Tue", "src": "Busan City foreign-language menu (menu.busan.go.kr)", "q": "자갈치시장 달봉이횟집", "credit": "Photo: 부산광역시 외국어 메뉴판"}]}, {"name": "Gukje Market", "ko": "국제시장", "gu": "중구", "day": "oldtown", "pin": "국제시장", "tag": "SINCE 1945", "line": "Began as a 'dottegi' market after liberation and kept refugees alive during the Korean War.", "hours": "09:00–20:00 · 일요일 휴무", "src": "VisitKorea", "q": "국제시장", "photo": "gukje.jpg", "credit": "Photo: Hankook12 / Wikimedia Commons (CC0)", "origin": "After liberation in 1945, returnees and departing Japanese sold goods on an empty firebreak lot, bundles traded unopened. People called it the 'dottegi' market. It became the Free Market in 1948, filled with refugees during the Korean War (about 1,300 stalls by the early 1950s), and was later named Gukje (international) for the US Army and imported goods sold here.", "enjoy": [["Themed alleys", "Used-clothing, patbingsu (shaved ice), food, cosmetics and small-goods alleys."], ["Bridges on the 2nd floor", "Footbridges link the market buildings. Go up to find your way and look down on the stalls."], ["Film location", "The 2014 film Ode to My Father (국제시장, over 10 million viewers) was set around a shop here."], ["Bosu-dong Book Street", "Korea's only remaining used-book street is right across the road."]], "shops": [{"k": "seojinseop", "name": "Seojinseop Dwaeji Gukbap", "ko": "서진섭돼지국밥", "stall": "Inside Gukje Market", "known": "Pork-and-rice soup, sundae gukbap and boiled pork in generous portions. A VisitBusan 'old shop' pick.", "addr": "중구 광복로39번길 30-1", "tel": "051-254-5074", "hours": "Mon–Sat 09:00–20:00 · 2nd & 4th Sun until 17:00 · closed 1st, 3rd, 5th Sun", "src": "VisitBusan · Busan City foreign-language menu (menu.busan.go.kr)", "q": "서진섭돼지국밥", "credit": "Photo: 부산광역시 외국어 메뉴판"}]}, {"name": "Bupyeong Kkangtong Market", "ko": "부평깡통시장", "gu": "중구", "day": "oldtown", "pin": "부평깡통시장", "tag": "NIGHT MARKET", "line": "Named for the US Army canned goods sold here. Korea's first permanent night market (2013). Fish cake street inside.", "hours": "09:00–20:00 · 야시장 19:30–24:00", "src": "Jung-gu Office", "q": "부평깡통야시장", "photo": "bupyeong.jpg", "credit": "Photo: Christophe95 / Wikimedia Commons (CC BY-SA 4.0)", "origin": "Opened in 1910 as Korea's first public market. After the war it sold canned goods from US Army bases, so people called it kkangtong (can) market. In the 1970s it was known for C-rations and imported goods.", "enjoy": [["Night market · 19:30–24:00", "A 110 m lane between gates 3 and 4: 11 local food stalls, 6 multicultural stalls (Japanese, Filipino and more) and 13 clothing stalls."], ["Fish cake street", "Fish cake shops gathered here in the 1960s after Busan's first fish cake factory opened nearby."], ["Danpatjuk street", "A lane of red bean porridge shops between the import stores. The Kkangtong style is Japanese-influenced: grilled injeolmi (rice cake) on top. In summer, try the patbingsu."], ["Porridge alley and hanbok street", "Porridge shops here are often run by the second generation: red bean, pumpkin, sesame, pine nut and mung bean porridge."], ["Jokbal and gopchang alleys", "A few steps outside the market."], ["Street shows", "Magic and guitar performances at the entrance twice a day."]], "shops": [{"k": "yubu", "name": "Kkangtong Golmok Halmae Yubu Jeongol", "ko": "깡통골목할매 유부전골 본점", "stall": "Near market gate 7", "known": "The original yubu jeongol: tofu pouches stuffed with glass noodles and vegetables, simmered in fish-cake broth. People line up to take it home.", "addr": "중구 부평3길 29", "tel": "051-245-1878", "hours": "10:00–18:00 (check before going)", "src": "Busan City 'Food Talking' · news 2025", "q": "깡통골목할매 유부전골 본점", "credit": "Photo: 부산광역시 (busan.go.kr)"}, {"k": "igane", "name": "Igane Tteokbokki", "ko": "이가네떡볶이", "stall": "Inside the market", "known": "Tteokbokki and tteok-twi (tteokbokki with fried snacks). A Taste of Busan pick, always busy. Closes before the night market opens.", "addr": "중구 부평1길 48 일대 (부평깡통시장)", "tel": "051-245-0413", "hours": "10:00–17:00 · closed Sun", "src": "Taste of Busan · VisitBusan", "q": "이가네떡볶이 부평", "credit": "Photo: VisitBusan · dish"}, {"k": "", "name": "Somunnan Juk", "ko": "소문난죽", "stall": "Porridge alley", "known": "Said to be the oldest porridge shop in the market, about 70 years. Red bean porridge ₩6,000, not too sweet, with rice balls; also mung bean and pumpkin porridge. Featured on MBN's 'Jeon Hyun-moo Plan' (2024).", "addr": "중구 중구로43번길 36", "tel": "051-244-7485", "hours": "Check before going", "src": "MBN broadcast via TV listing blog (2024) · not an official listing", "q": "소문난죽 부평", "credit": ""}]}, {"name": "Gupo Market", "ko": "구포시장", "gu": "북구", "day": "sasang", "pin": "구포시장", "tag": "5-DAY MARKET", "line": "About 400 years old. The 5-day market fills the alleys on dates ending in 3 and 8. Gupo noodles.", "hours": "08:00–20:00 · 점포별 상이", "src": "VisitBusan", "q": "구포시장", "photo": "gupo.jpg", "credit": "Photo: VisitBusan", "origin": "The market grew at Gupo ferry on the Nakdong, where farm goods from inland met seafood from the coast. Floods kept washing it out, so it moved to its current site after a riverbank was built in 1932. The 5-day market began in the 1930s and a permanent market opened in 1972.", "enjoy": [["Mukja (food) alley", "Gupo noodles, market gukbap, jokbal, porridge, handmade tofu and fried snacks."], ["12 themed alleys", "Including the herb alley and the seafood alley."], ["Kkwabaegi and noodles", "Twisted doughnuts as a snack, then a bowl of Gupo noodles."], ["Golden Sunset Bridge", "From the market entrance, a footbridge crosses the river to Hwamyeong Eco Park, a sunset spot."]], "shops": [{"k": "iwonhwa", "name": "Iwonhwa Gupo Guksi", "ko": "이원화구포국시", "stall": "Inside Gupo Market", "known": "Gupo noodles: warm anchovy-broth noodles ₩6,000, spicy mixed noodles ₩7,000.", "addr": "구포시장 안 (지도에서 확인)", "tel": "", "hours": "Market 08:00–20:00", "src": "VisitBusan (Oct 2026)", "q": "이원화구포국시", "credit": "Photo: VisitBusan · 조민경"}, {"k": "gangdaegam", "name": "Gang Daegam Son Kalguksu", "ko": "강대감손칼국수", "stall": "Market street", "known": "Handmade knife-cut noodle soup. The sign also lists jjajangmyeon, milmyeon and kongguksu.", "addr": "북구 구포시장길 6", "tel": "051-334-3158", "hours": "Mon–Sat 11:00–20:00 · Sun 11:00–17:30", "src": "Busan City foreign-language menu (menu.busan.go.kr)", "q": "강대감손칼국수", "credit": "Photo: 부산광역시 외국어 메뉴판"}, {"k": "badasan", "name": "Badasan Gomjangeo", "ko": "바다산곰장어", "stall": "Seafood alley", "known": "Live hagfish, usually grilled. Small ₩40,000 to extra-large ₩80,000; fried rice after ₩2,000. Look for the '산곰장어' awning.", "addr": "북구 구포시장길 41", "tel": "051-332-4896", "hours": "10:00–21:30", "src": "Busan City foreign-language menu (menu.busan.go.kr)", "q": "바다산곰장어", "credit": "Photo: 부산광역시 외국어 메뉴판"}]}, {"name": "Bujeon Market", "ko": "부전시장 (부전마켓타운)", "gu": "부산진구", "day": "", "pin": "부전시장", "tag": "MORNING MARKET", "line": "", "hours": "07:00–19:00 · 가게별 상이", "src": "VisitBusan · Busan City (Dynamic Busan) · 전국별별시장", "q": "부전마켓타운", "photo": "bujeon.jpg", "credit": "Photo: VisitBusan", "origin": "Built by refugees who gathered here to make a living after the Korean War, and registered as a market in 1975. In 2006 six markets joined as 'Bujeon Market Town', including a ginseng market and a dawn farm-and-fish market, so the whole area is huge. Busan people still just say Bujeon Market. Bujeon Station (Line 1) exit 1 is 3 minutes away.", "enjoy": [["Dawn trading", "Farmers and fishers sell directly from early morning, so it is busiest and freshest before noon."], ["Ginseng market on 2F", "A large ginseng wholesale market: fresh, dried and red ginseng. One of only two specialized ginseng markets in Korea, with Seoul's Gyeongdong Market."], ["Freshwater fish alley", "Eel, carp, loach and more. Said to be the only freshwater fish market alley in Korea."], ["Market food everywhere", "Bindaetteok, jeon, gukbap, kalguksu, fish cakes and fried snacks, day and night."], ["Porridge alley and summer drinks", "Porridge and blood-sausage soup year round; cold kongguk (soy milk soup) and sikhye in summer."]], "shops": [{"k": "", "name": "Myeongnan Gimbap", "ko": "명란김밥", "stall": "Bujeon Market 1F", "known": "Gimbap with pollock roe and thin egg, about ₩4,000 a roll; also tuna, spicy pepper and flying-fish roe rolls. Featured on SBS 'Master of Living'. Takeout only, the line moves fast.", "addr": "부산진구 중앙대로783번길 23, 부전시장 내", "tel": "010-8988-2148", "hours": "07:30–17:30 (until sold out)", "src": "SBS broadcast listing · Siksin (2025.11) · not an official listing", "q": "부전시장 명란김밥", "credit": ""}, {"k": "", "name": "Bujeon Tteokgalbi", "ko": "부전떡갈비", "stall": "No. 119", "known": "Handmade pork tteokgalbi (grilled patties), often the longest line in the market. About ₩11,000 for 5 pieces. Takeout.", "addr": "부산진구 중앙대로783번길 23, 119호", "tel": "", "hours": "10:00–18:00 (until sold out)", "src": "Visitor reviews (2026) · not an official listing", "q": "부전떡갈비", "credit": ""}, {"k": "", "name": "Wangppolttegi (main branch)", "ko": "부전시장 왕뽈떼기 본점", "stall": "Across from Gaya Church", "known": "Cod cheek soup (daegu ppoltang) from ₩7,000 at lunch; mixed with roe ₩9,000. Dinner sets from 17:00.", "addr": "부산진구 부전로152번길 51, 1층", "tel": "", "hours": "Tue–Sun 11:00–20:30 · break 15:00–17:0  main summer festival, set against the Dadaepo sunset, with an opening fireworks show from the sea and free concerts. Same beach as the Sunset Day.", "src": "부산축제조직위원회 (Aug 2026)", "poster": "seafestival.jpg", "credit": "Poster: 부산광역시 / 부산축제조직위원회", "day": "saha"}, {"slug": "burock", "month": 10, "mon": "OCT", "ko": "부산국제록페스티벌", "name": "BUROCK", "venue": "Samrak Ecological Park", "last": "2026.10.2–10.4", "next": "2027 confirmed · dates TBA", "stats": [["80,000", "paid visitors in 2026, a record"], ["81%", "came from outside Busan"], ["99", "acts on the 2026 lineup"]], "why": "Started in 2000 and now in its 27th year, in a riverside park in West Busan. The guide starts here.", "src": "부산일보 2026.10.11 · 부산일보 2026.9.7", "poster": "burock.jpg", "credit": "Poster: 부산국제록페스티벌 (official)", "day": "sasang"}, {"slug": "biff", "month": 10, "mon": "OCT", "ko": "부산국제영화제", "name": "Busan International Film Festival", "venue": "Busan Cinema Center, Centum City + 8 theaters", "last": "31st · 2026.10.6–10.15", "next": "2027 TBA", "stats": [["277,027", "total attendance"], ["200,043", "film audience, the highest since 2015"], ["246", "films from 59 countries in the official selection"]], "why": "2026 was BIFF's first year as a FIAPF 'A-list' festival, with about 300 Q&A sessions where audiences meet the filmmakers.", "src": "BIFF 2026 report · 연합뉴스 2026.10.15", "poster": "biff.jpg", "credit": "Poster: © Busan International Film Festival"}, {"slug": "dongnae", "month": 10, "mon": "OCT", "ko": "동래읍성역사축제", "name": "Dongnae Eupseong History Festival", "venue": "Dongnae Eupseong north gate, Myeongnyun 1beonga", "last": "32nd · 2026.10.16–10.18", "next": "2027 expected · dates TBA", "stats": [["57", "programs in 2026"], ["1st", "of 30 Busan festivals in the 2025 expert review"], ["240,000+", "visitors in 2024 (Dongnae-gu estimate)"]], "why": "Restages the 1592 battle of Dongnaeseong on the real site as an outdoor musical, plus a three-strand tug-of-war and a Joseon market paid in old coins.", "src": "TV부산 2026.9.21 · 연합뉴스 2026.2.8 · 국제신문 2025.2.27", "poster": "dongnae.jpg", "credit": "Poster: 동래구 / 동래읍성역사축제추진위원회"}, {"slug": "fireworks", "month": 11, "mon": "NOV", "ko": "부산불꽃축제", "name": "Busan Fireworks Festival", "venue": "Gwangalli Beach, Igidae, Dongbaekseom", "last": "20th · 2025.11.15", "next": "21st · 2026.11.7 (Sat)", "stats": [["1.17M", "visitors in 2025 (Busan City estimate)"], ["90,000", "fireworks fired"], ["13", "launch barges at sea"]], "why": "A free citywide night show over Gwangan Bridge and the sea, watched from the beach.", "src": "부산일보 2025.11.15 · busanfireworks.com", "poster": "fireworks.jpg", "credit": "Poster: 부산광역시 / 부산축제조직위원회"}], "story": [{"y": "2000", "place": "Gwangalli Beach", "ko": "광안리해수욕장", "text": "The 1st BUROCK opens on a special stage on the beach (July 15–17), free to all. A city-run rock festival was a first in Korea at the time.", "src": "Wikipedia (ko) · 국제신문 2017.4.2"}, {"y": "2002–2010", "place": "Dadaepo Beach", "ko": "다대포해수욕장", "day": "saha", "text": "Noise complaints push the festival west to Dadaepo. These years became a holy ground for thrash metal and hardcore. At high tide the sea came right up to the front of the stage, and typhoons sometimes pushed the dates back.", "src": "Wikipedia (ko) · 뉴시스 2026.10.10"}, {"y": "2011", "place": "Samrak Ecological Park", "ko": "삼락생태공원", "day": "sasang", "text": "After electrocution risks at Dadaepo, the 12th edition moves inland to the Nakdong riverside. Free from the noise and time limits of the beaches, Samrak became BUROCK's own 'liberated zone' for bands and crowds.", "src": "국제신문 2017.4.2 · 국제신문 2026.7.21"}, {"y": "2019", "place": "20th edition", "ko": "20회 · 유료화", "text": "After 19 free years, BUROCK becomes a paid festival (2-day pass ₩88,000) to bring bigger international headliners. The first paid years had growing pains, but local sponsors such as Daesun Brewing stayed on.", "src": "부산축제조직위원회 2019.5.13 · 뉴시스 2026.10.10"}, {"y": "2025", "place": "25th edition", "ko": "25회", "text": "About 70,000 visitors, including 7,000 at 'Road to BU-ROCK' warm-up shows in Seoul, Busan, Jeonju and Taipei. Reusable containers cut the festival's waste.", "src": "부산일보 2025.9.29"}, {"y": "2026", "place": "27th year", "ko": "27년째", "day": "sasang", "text": "A record 80,000 paid visitors, 81% from outside Busan. A neighborhood women's association from an apartment 700 m away sold out its gukbap and became the 'food headliner', and Bu-long Night at Sasang Indie Station kept the crowd in West Busan after the shows. Named a national Pre-Global Festival.", "src": "부산일보 2026.10.11 · korea.kr 2026.10.13"}], "essentials": [{"slug": "yonggungsa", "name": "Haedong Yonggungsa Temple", "ko": "해동용궁사", "gu": "기장군", "tag": "TEMPLE BY THE SEA", "text": "A temple built right on the coastal rocks. The path in passes the 12 zodiac statues and 108 steps through pines. Keep your voice down and use the side doors of the main hall.", "hours": "04:30–19:20 (last entry 18:50) · free", "access": "Haeundae Stn exit 7 → bus 181/100, or Osiria Stn exit 1 → bus 139", "src": "VisitBusan · temple website", "q": "해동용궁사", "credit": "Photo: Londenp / Wikimedia Commons (CC BY-SA 3.0)"}, {"slug": "beomeosa", "name": "Beomeosa Temple", "ko": "범어사", "gu": "금정구", "tag": "SINCE 678", "text": "Founded by the monk Uisang in 678, one of the three great temples of Yeongnam. Its low Iljumun gate makes you bow as you enter. A working monastery with temple stays.", "hours": "08:00–17:00 · free", "access": "Beomeosa Stn (Line 1) exit 5 or 7 → bus 90", "src": "VisitBusan", "q": "범어사", "credit": "Photo: Basile Morin / Wikimedia Commons (CC BY-SA 4.0)"}, {"slug": "haeundae", "name": "Haeundae & Dalmaji Hill", "ko": "해운대 & 달맞이길", "gu": "해운대구", "tag": "BEACH", "text": "A 1.5 km white-sand beach with over 10 million summer visitors. From Mipo at its east end, the Haeundae Beach Train runs 4.8 km along the old Donghae Nambu Line rails to Songjeong, the sea right outside the window (about 25 min one way). Walk up Dalmaji-gil toward evening for the moonrise it is named for.", "hours": "Beach always open · Beach Train 09:00–19:00 (Nov–Feb), later in summer", "access": "Haeundae Stn (Line 2) exit 5, 15 min walk · Beach Train from Mipo Station", "src": "VisitBusan · Haeundae Blueline Park", "q": "해운대해수욕장", "credit": "Photo: Korea Tourism Organization (KOGL Type 1)"}, {"slug": "dongbaek", "name": "Dongbaekseom Island", "ko": "동백섬", "gu": "해운대구", "tag": "COASTAL WALK", "text": "A pine-covered headland at the west end of Haeundae Beach, once an island and still called one. A 950 m coastal deck passes the bronze mermaid statue, a short suspension bridge and a white lighthouse, with Gwangan Bridge across the water. Nurimaru APEC House, venue of the 2005 APEC summit, sits on the point.", "hours": "Walkway always open · Nurimaru 09:00–18:00, closed 1st Mon · free", "access": "Dongbaek Stn (Line 2) exit 1, ~20 min walk · or walk west along Haeundae Beach", "src": "VisitBusan", "q": "동백섬", "credit": "Photo: Michiel1972 / Wikimedia Commons (CC BY-SA 3.0)"}, {"slug": "gwangalli", "name": "Gwangalli & Gwangan Bridge", "ko": "광안리 & 광안대교", "gu": "수영구", "tag": "NIGHT VIEW", "text": "The city's beach, facing the 7.4 km Gwangan Bridge that lights up after dark. The Busan Fireworks Festival is launched from here every autumn. Suyeong Yaryu and Eobang-nori also come from this bay.", "hours": "Always open · free", "access": "Gwangan Stn (Line 2) exit 5, 13 min walk", "src": "VisitBusan · Encyclopedia of Korean Culture", "q": "광안리해수욕장", "credit": "Photo: lumoplank / Wikimedia Commons (CC0)"}, {"slug": "taejongdae", "name": "Taejongdae", "ko": "태종대", "gu": "영도구", "tag": "SEA CLIFFS", "text": "Sea cliffs and wave-cut rock at the tip of Yeongdo, a national Scenic Site and part of Busan Geopark. Ride the Danubi train to the observatory, then walk down to the 1906 lighthouse. Pairs well with Harbor Day (same island as Huinnyeoul).", "hours": "Park open early to midnight · Danubi train closed Mon", "access": "Nampo Stn exit 6 → bus 8 or 30", "src": "VisitBusan · Busan Geopark", "q": "태종대", "credit": "Photo: *intacto / Wikimedia Commons (CC BY 2.0)", "pair": "oldtown"}]};

    s += `<path d="${v.d}" fill="${f}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
  s += `<path d="${M.river}" fill="none" stroke="#9fbfe0" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
  for (let [n, [x, y]] of Object.entries(M.cent)) {
    const on = !!hl[n];
    if (n === '중구' && z === 1) {
      s += `<line x1="${x}" y1="${y}" x2="${x+20}" y2="${y-6}" stroke="${on?hl[n]:'#8a8f9e'}" stroke-width="1"/><text x="${x+22}" y="${y-4}" font-size="${on?9:7}" font-weight="800" fill="${on?hl[n]:'#7a7f8e'}" ${halo}>${n}</text>`;
      continue;
    }
    if (on && z > 1) continue; // zoomed view: pins carry the labels
    if (n === '사상구' && pins.includes('삼락생태공원')) { x += 7; y -= 13; }
    if (o.nudge && o.nudge[n]) { x += o.nudge[n][0]; y += o.nudge[n][1]; }
    const big = on ? 9 : 7;
    s += on ? `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs(big)}" font-weight="800" fill="#fff">${n}</text>`
            : `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs(big)}" font-weight="600" fill="#8a8f9e" ${halo}>${n}</text>`;
  }
  if (o.east) s += `<text x="${M.cent['해운대구'][0]+6}" y="${M.cent['해운대구'][1]+30}" text-anchor="middle" font-size="7" font-weight="700" fill="#6b6f80" ${halo}>Main beaches</text>`;
  pins.forEach((n, i) => { const p = M.pins[n]; if (!p) return;
    if (n === '삼락생태공원') {
      const sz = 15/z, w = sz*0.89, bs = sz*1.15, bw = bs*0.905;
      s += `<image href="${A('icon_pick_bg.png')}" x="${p[0]-bw/2}" y="${p[1]-bs/2}" width="${bw}" height="${bs}"/><image href="${A('icon_pick_grad.png')}" x="${p[0]-w/2}" y="${p[1]-sz/2}" width="${w}" height="${sz}"/><text x="${p[0]-sz*0.75}" y="${p[1]+3/z}" text-anchor="end" font-size="${fs(8)}" font-weight="800" fill="#0b3387" ${halo}>BUROCK</text>`;
    } else {
      const lab = (o.labels && o.labels[n]) || n; const left = o.left && o.left.includes(n);
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="${fs(3.6)}" fill="#ec9c00" stroke="#fff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
      const up = o.up && o.up.includes(n);
      if (o.pinLabels && lab.trim()) s += `<text x="${up ? p[0] : p[0] + (left?-6:6)/z}" y="${up ? p[1]-6/z : p[1]+3/z}" text-anchor="${up?'middle':left?'end':'start'}" font-size="${fs(7.5)}" font-weight="800" fill="#0b3387" ${halo}>${lab}</text>`;
    } });
  return `<div class="map">${s}</svg></div>`;
}

function reveal(){
  if (!matchMedia('(min-width:1000px)').matches) return; // web layout only; phone stays as is
  const sel = '.sec,.hero h2,.hero p,.hero .band img,.hday .map,.mapcap,.card,.list a,.more,.prow a,.dband .bt,.dband img,.dg .st,.dg .lg,.pill,.tlead,.ec,.evc,.ev,.shop,.enjoy li,.localnote,.info .row,.mrow,.dt h2,.stats div';
  const els = [...document.querySelectorAll('#view ' + sel.split(',').join(',#view '))];
  const seen = new Map();
  els.forEach(el => { const p = el.parentElement; const k = (seen.get(p) || 0); seen.set(p, k + 1); el.style.setProperty('--d', Math.min(k, 6) * 70 + 'ms'); el.classList.add('rv'); });
  if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .05 });
  els.forEach(el => io.observe(el));
}
document.documentElement.classList.add('js');
function route(){
  const h = location.hash.slice(1) || 'home';
  const [p, x, y] = h.split('/');
  let html = home();
  if (p === 'day' && area(x)) html = day(x);
  else if (p === 'place' && area(x)) html = place(x, +y);
  else if (p === 'markets') html = markets();
  else if (p === 'essentials') html = essentials();
  else if (p === 'events') html = events();
  else if (p === 'event' && D.events.find(v=>v.slug===x)) html = eventDetail(x);
  else if (p === 'market' && D.markets[+x]) html = marketDetail(+x);
  else if (p === 'story') html = story();
  document.getElementById('view').innerHTML = html;
  window.scrollTo(0,0);
  reveal();
}
